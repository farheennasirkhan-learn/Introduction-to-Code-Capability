<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready to Begin</title>
<style>html,body{margin:0;background:#0f172a;min-height:100vh}</style>
<style>
/* ===== SLIDE NAV ===== */
.slide-nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:9999;font-family:'Poppins',system-ui,sans-serif}
.slide-nav .nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#111;color:#fff;text-decoration:none;transition:all .2s ease;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.slide-nav .nav-btn:hover{background:#333;transform:scale(1.06)}
.slide-nav .nav-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.slide-nav .nav-disabled{opacity:.25;pointer-events:none}
.slide-nav .nav-label{font-size:13px;font-weight:500;color:#5f6368;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.slide-nav .nav-btn{border:1px solid rgba(255,255,255,.25)}.slide-nav .nav-label{background:rgba(255,255,255,.95)}
</style>
</head><body><div class="turing-dark-container">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* --- Scoped Wrapper --- */
    .turing-dark-container {
      --bg-deep: #0f172a;
      --bg-surface: #1e293b;
      --turing-blue: #317eff;
      --accent-purple: #a855f7;
      --accent-teal: #2dd4bf;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      
      font-family: 'Poppins', sans-serif;
      background-color: transparent;
      padding: 60px 40px;
      color: var(--text-main);
      text-align: center;
      position: relative;
      overflow: hidden;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* --- Animated Gradient Header --- */
    .turing-header-group {
      max-width: 800px;
      margin-bottom: 20px;
      z-index: 2;
    }

    .turing-intro-text {
      font-size: 18px;
      font-weight: 400;
      color: #ffff;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 15px;
      display: block;
    }

    .turing-title-gradient {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(90deg, #317eff, #a855f7, #2dd4bf, #317eff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    /* --- Horizontal Pillar Layout (No Cards/Rounded Boxes) --- */
    .turing-pillar-grid {
      display: flex;
      width: 100%;
      max-width: 1000px;
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .turing-pillar {
      flex: 1;
      padding: 40px 30px;
      cursor: pointer;
      position: relative;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }

    .turing-pillar:last-child {
      border-right: none;
    }

    /* Sharp visual markers instead of boxes */
    .turing-active-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    /* Icon Styling */
    .turing-pillar-icon {
      margin-bottom: 15px;
      color: var(--text-dim);
      transition: all 0.4s ease;
    }

    .turing-pillar-icon i {
      font-size: 66px;
    }

    /* Content Styling */
    .turing-pillar-body {
      font-size: 18px;
      line-height: 1.6;
      color: var(--text-dim);
      transition: all 0.4s ease;
      font-weight: 300;
    }

    /* --- Interaction States --- */
    .turing-pillar.active {
      background: rgba(255, 255, 255, 0.03);
    }

    .turing-pillar.active .turing-active-indicator {
      transform: scaleX(1);
    }

    .turing-pillar.active .turing-pillar-body {
      color: var(--text-main);
      font-weight: 400;
    }

    /* Individual Color Accents */
    .turing-pillar[data-index="0"].active .turing-active-indicator { background: var(--turing-blue); }
    .turing-pillar[data-index="0"].active .turing-pillar-icon { color: var(--turing-blue); transform: translateY(-5px); }
    
    .turing-pillar[data-index="1"].active .turing-active-indicator { background: var(--accent-purple); }
    .turing-pillar[data-index="1"].active .turing-pillar-icon { color: var(--accent-purple); transform: translateY(-5px); }

    .turing-pillar[data-index="2"].active .turing-active-indicator { background: var(--accent-teal); }
    .turing-pillar[data-index="2"].active .turing-pillar-icon { color: var(--accent-teal); transform: translateY(-5px); }

    /* Passive Liveliness: Glowing Aura */
    .turing-bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(49, 126, 255, 0.1) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      animation: pulse-glow 8s infinite alternate;
    }

    @keyframes pulse-glow {
      from { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0.7; transform: translate(-50%, -50%) scale(1.3); }
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .turing-dark-container {
        padding: 40px 20px;
      }
      .turing-pillar-grid {
        flex-direction: column;
        border-top: none;
        border-bottom: none;
      }
      .turing-pillar {
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
        align-items: flex-start;
        padding: 30px 10px;
      }
      .turing-active-indicator {
        left: 0;
        top: 0;
        width: 4px;
        height: 100%;
        transform: scaleY(0);
      }
      .turing-pillar.active .turing-active-indicator {
        transform: scaleY(1);
      }
    }
  </style>

  <div class="turing-bg-glow"></div>

  <div class="turing-header-group">
    <span class="turing-intro-text">Thank you for completing this introduction!</span>
    <h2 class="turing-title-gradient">You’re now ready to begin your journey with Turing.</h2>
  </div>

  <div class="turing-pillar-grid" id="interactionGrid">
    <div class="turing-pillar" data-index="0">
      <div class="turing-active-indicator"></div>
      <div class="turing-pillar-icon">
        <i class="material-icons">explore</i>
      </div>
      <div class="turing-pillar-body">
        Discover exciting career opportunities
      </div>
    </div>

    <div class="turing-pillar active" data-index="1">
      <div class="turing-active-indicator"></div>
      <div class="turing-pillar-icon">
        <i class="material-icons">groups</i>
      </div>
      <div class="turing-pillar-body">
        Connect with a global community of top-tier talent
      </div>
    </div>

    <div class="turing-pillar" data-index="2">
      <div class="turing-active-indicator"></div>
      <div class="turing-pillar-icon">
        <i class="material-icons">auto_graph</i>
      </div>
      <div class="turing-pillar-body">
        Take the next step toward growing your career with Turing.
      </div>
    </div>
  </div>

  <script>
    (function() {
      const grid = document.getElementById('interactionGrid');
      const pillars = grid.querySelectorAll('.turing-pillar');
      let currentIndex = 0;
      let isLocked = false;
      let autoCycle;

      function setActive(index) {
        pillars.forEach((p, i) => {
          p.classList.toggle('active', i === index);
        });
      }

      function startCycle() {
        autoCycle = setInterval(() => {
          if (!isLocked) {
            currentIndex = (currentIndex + 1) % pillars.length;
            setActive(currentIndex);
          }
        }, 4000);
      }

      function stopCycle() {
        clearInterval(autoCycle);
      }

      pillars.forEach((pillar, index) => {
        // Hover Support
        pillar.addEventListener('mouseenter', () => {
          if (!isLocked) {
            stopCycle();
            setActive(index);
          }
        });

        pillar.addEventListener('mouseleave', () => {
          if (!isLocked) {
            startCycle();
          }
        });

        // Click to Lock Support
        pillar.addEventListener('click', () => {
          isLocked = true;
          stopCycle();
          setActive(index);
          currentIndex = index;
        });
      });

      // Initialize
      startCycle();
    })();
  </script>
</div>
