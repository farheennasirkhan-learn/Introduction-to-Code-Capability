<!DOCTYPE html>
<html lang="en"><head>
<title>Key Aspects of the Work</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&amp;family=Material+Icons+Outlined&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --turing-blue: #317eff;
            --bg-light: #f4f7f9;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --text-main: #121212;
            --border: rgba(49, 126, 255, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 700px; width: 100%; }
        header { text-align: center; margin-bottom: 30px; }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* Animations */
        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.03); opacity: 0.6; }
            100% { transform: scale(1); opacity: 0.4; }
        }

        @keyframes iconGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes finalGlow {
            0% { box-shadow: 0 0 5px rgba(49, 126, 255, 0.2); }
            50% { box-shadow: 0 0 20px rgba(49, 126, 255, 0.6); }
            100% { box-shadow: 0 0 5px rgba(49, 126, 255, 0.2); }
        }

        @keyframes bgGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Cards */
        .check-item {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 15px;
            transition: all 0.4s ease;
            cursor: pointer;
            filter: grayscale(1);
            opacity: 0.4;
            animation: breathe 3s ease-in-out infinite;
        }

        .check-item.selected {
            filter: grayscale(0);
            opacity: 1;
            background: #ffffff;
            border-color: var(--turing-blue);
            transform: scale(1.05);
            animation: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .icon-box {
            width: 50px; height: 50px;
            background: rgba(49, 126, 255, 0.08);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--turing-blue);
        }

        .check-item.selected .icon-box {
            background: linear-gradient(-45deg, #317eff, #7baeff, #317eff, #0046be);
            background-size: 300% 300%;
            animation: iconGradient 3s ease infinite;
            color: white;
        }

        .check-item p { margin: 0; font-size: 18px; font-weight: 500; }

        /* Conclusion Bar */
        .conclusion-bar {
            grid-column: 1 / -1;
            position: relative;
            background: #dee5ed;
            padding: 10px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* The Fill Layer */
        .conclusion-bar::before {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%;
            width: var(--progress, 25%);
            background: var(--turing-blue);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        /* Final State: Animated Gradient Background & Glow */
        .conclusion-bar.finished {
            background: linear-gradient(-45deg, #317eff, #619eff, #1a56c5, #317eff);
            background-size: 400% 400%;
            animation: bgGradientShift 4s ease infinite, finalGlow 2s ease-in-out infinite;
            border: none;
        }

        .conclusion-bar.finished::before {
            display: none; /* Remove the loading layer to show the animated bg */
        }

        .conclusion-bar p, .conclusion-bar span {
            position: relative; z-index: 1;
            color: #728197;
            transition: color 0.3s ease;
        }

        .conclusion-bar.active-text p, 
        .conclusion-bar.active-text span { color: white; }

        @media (max-width: 600px) { .checklist-grid { grid-template-columns: 1fr; } }
    </style>
<style>
/* ===== SLIDE NAV ===== */
.slide-nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:9999;font-family:'Poppins',system-ui,sans-serif}
.slide-nav .nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#111;color:#fff;text-decoration:none;transition:all .2s ease;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.slide-nav .nav-btn:hover{background:#333;transform:scale(1.06)}
.slide-nav .nav-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.slide-nav .nav-disabled{opacity:.25;pointer-events:none}
.slide-nav .nav-label{font-size:13px;font-weight:500;color:#5f6368;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.06)}

</style>
</head>
<body>

<div class="container">
    <header><h1>Key Aspects of the Work</h1></header>
    <div class="checklist-grid">
        <div class="check-item selected" data-id="1" onmouseover="handleHover(this)">
            <div class="icon-box"><span class="material-icons-outlined">fact_check</span></div>
            <p>Evaluate the student’s answer, not the effort
</p>
        </div>
        <div class="check-item" data-id="2" onmouseover="handleHover(this)">
            <div class="icon-box"><span class="material-icons-outlined">gavel</span></div>
            <p>You follow the rubric, not personal preference</p>
        </div>
        <div class="check-item" data-id="3" onmouseover="handleHover(this)">
            <div class="icon-box"><span class="material-icons-outlined">sync</span></div>
            <p>You apply the same standard every time</p>
        </div>
        <div class="check-item" data-id="4" onmouseover="handleHover(this)">
            <div class="icon-box"><span class="material-icons-outlined">forum</span></div>
            <p>You explain decisions clearly</p>
        </div>

        <div id="conclusion" class="conclusion-bar" style="--progress: 25%;">
            <span class="material-icons-outlined">verified</span>
            <p>Consistency is what makes your work valuable. </p>
        </div>
    </div>
</div>

<script>
    const visited = new Set([1]);
    updateProgressBar();

    function handleHover(element) {
        const id = parseInt(element.getAttribute('data-id'));
        element.classList.add('selected');
        if (!visited.has(id)) {
            visited.add(id);
            updateProgressBar();
        }
    }

    function updateProgressBar() {
        const bar = document.getElementById('conclusion');
        const count = visited.size;
        bar.style.setProperty('--progress', `${(count / 4) * 100}%`);

        if (count >= 2) bar.classList.add('active-text');
        if (count === 4) {
            // Delay slightly to let the fill reach 100% before switching to animated bg
            setTimeout(() => {
                bar.classList.add('finished');
            }, 500);
        }
    }
</script>

</div>

</body></html>
