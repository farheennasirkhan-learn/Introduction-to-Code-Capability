<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to Code Capability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%}
  body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#ffffff 0%,#eef5ff 100%);color:#0f172a;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
  body::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(49,126,255,.14),transparent 70%);top:-180px;right:-140px;pointer-events:none}
  body::after{content:'';position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(49,126,255,.08),transparent 70%);bottom:-100px;left:40px;pointer-events:none}
  .cover{position:relative;z-index:1;text-align:center;max-width:760px;animation:codeCoverIn 1s ease both}
  .label{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#317eff;margin-bottom:14px}
  h1{font-size:clamp(32px,6vw,56px);font-weight:700;line-height:1.1;letter-spacing:-.04em;margin:0 0 18px}
  .bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#317eff,#6aa4ff);margin:0 auto}
  @keyframes codeCoverIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<style>
/* ===== SLIDE NAV ===== */
.slide-nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:9999;font-family:'Poppins',system-ui,sans-serif}
.slide-nav .nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#111;color:#fff;text-decoration:none;transition:all .2s ease;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.slide-nav .nav-btn:hover{background:#333;transform:scale(1.06)}
.slide-nav .nav-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.slide-nav .nav-disabled{opacity:.25;pointer-events:none}
.slide-nav .nav-label{font-size:13px;font-weight:500;color:#5f6368;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.06)}

</style>
</head>
<body>
  <div class="cover">
    <div class="label">Module</div>
    <h1>Introduction to Code Capability</h1>
    <div class="bar"></div>
  </div>

<div class="slide-nav">
  <span class="nav-btn nav-disabled"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
  <span class="nav-label">1 / 9</span>
  <a href="slide-02.html" class="nav-btn" title="Next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
</div>

</body>
</html>
