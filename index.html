<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduction to Code Capability</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(66, 133, 244, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(52, 168, 83, 0.05) 0%, transparent 45%);
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky; top: 12px; z-index: 100;
      margin: 12px 24px 0; padding: 16px 28px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }
    .logo { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .logo span { color: #4285F4; }
    nav { display: flex; gap: 32px; }
    nav a {
      text-decoration: none; color: #5f6368; font-size: 16px; font-weight: 400;
      transition: color 0.2s ease;
    }
    nav a:hover { color: #4285F4; }
    main {
      flex: 1; max-width: 800px; margin: 0 auto;
      padding: 80px 24px 60px;
      display: flex; flex-direction: column; justify-content: center; text-align: center;
    }
    .hero h1 {
      font-size: clamp(36px, 4.5vw, 48px); font-weight: 600;
      letter-spacing: -1.3px; line-height: 1.25; margin-bottom: 18px; color: #202124;
    }
    .hero p {
      font-size: 18px; font-weight: 400; color: #5f6368;
      line-height: 1.8; max-width: 580px; margin: 0 auto 36px;
    }
    .cta {
      display: inline-block; padding: 14px 32px;
      background: #4285F4; color: #ffffff; text-decoration: none;
      font-size: 16px; font-weight: 500; border-radius: 9px;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
    }
    .cta:hover {
      background: #3367d6; transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.4);
    }
    footer {
      margin: 0 24px 20px; padding: 18px 24px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 14px; color: #5f6368;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    footer a { color: #5f6368; text-decoration: none; font-size: 14px; transition: color 0.2s ease; }
    footer a:hover { color: #4285F4; }
    @media (max-width: 600px) {
      header { margin: 10px 12px 0; padding: 14px 16px; flex-direction: column; gap: 12px; }
      main { padding: 50px 16px 40px; }
      .hero h1 { font-size: clamp(32px, 8vw, 40px); }
      .hero p { font-size: 16px; }
      footer { margin: 0 12px 16px; padding: 16px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Code <span>Capability</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="slide-01.html">Modules</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>Introduction to<br>Code Capability</h1>
      <p>Understand what the Code Capability is, the key aspects of the work, how you evaluate and are evaluated, and where the work happens.</p>
      <a href="slide-01.html" class="cta">Explore Module</a>
    </section>
  </main>
  <footer>
    <span>Introduction to Code Capability</span>
    <a href="#">Back to top</a>
  </footer>
</body>
</html>
