<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In this Capability</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
    /* 1. General Setup */
    body {
        color: #2d2d2d;
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 60px 20px;
        -webkit-font-smoothing: antialiased;
    }

    .container {
        display: flex;
        max-width: 1100px;
        margin: 0 auto;
        gap: 50px;
        align-items: center;
    }

    /* 2. Left Side Typography */
    .left-side {
        flex: 1;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
    }

    h1 {
        font-size: 3.5rem;
        font-weight: 600;
        margin-bottom: 14px;
        line-height: 1.1;
        letter-spacing: -1px;
        color: #1a1a1a;
    }

    .subtext {
        font-size: 1.5rem;
        line-height: 1.6;
        color: #317eff; /* Main Blue Color */
        font-weight: 600;
        max-width: 480px;
        margin-top: 0;
    }

    /* 3. The Blue Divider with Drawing Animation */
    .divider {
        width: 1px;
        background-color: #317eff;
        align-self: stretch;
        transform: scaleY(0);
        transform-origin: top;
        animation: growDown 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 0.3s;
    }

    /* 4. Right Side List Items */
    .right-side {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        gap: 32px;
        padding-left: 20px;
    }

    .list-item {
        font-size: 1.15rem;
        color: rgba(0, 0, 0, 0.3);
        transition: all 0.5s ease;
        cursor: pointer;
        line-height: 1.4;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeInUp 0.8s ease forwards;
    }

    /* Keyword Highlighting */
    .highlight {
        transition: color 0.5s ease;
        font-weight: 600;
    }

    /* Active State (Loop & Hover) */
    .list-item.active {
        color: #2d2d2d;
        transform: translateX(10px);
    }

    .list-item.active .highlight {
        color: #317eff;
    }

    /* 5. Animations */
    @keyframes fadeIn {
        to { opacity: 1; }
    }

    @keyframes growDown {
        to { transform: scaleY(1); }
    }

    @keyframes fadeInUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Staggered Entrance Delay */
    .list-item:nth-child(1) { animation-delay: 0.6s; }
    .list-item:nth-child(2) { animation-delay: 0.8s; }
    .list-item:nth-child(3) { animation-delay: 1.0s; }
    .list-item:nth-child(4) { animation-delay: 1.2s; }

    /* 6. Responsive Design (Mobile) */
    @media (max-width: 850px) {
        .container {
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
        }
        .divider {
            width: 100%;
            height: 2px;
            transform-origin: left;
            transform: scaleX(0);
            animation: growRight 1s ease forwards;
        }
        h1 { font-size: 2.5rem; }
        .right-side { padding-left: 0; }
    }

    @keyframes growRight {
        to { transform: scaleX(1); }
    }
</style>
<style>
/* ===== SLIDE NAV ===== */
.slide-nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;z-index:9999;font-family:'Poppins',system-ui,sans-serif}
.slide-nav .nav-btn{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:#111;color:#fff;text-decoration:none;transition:all .2s ease;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.slide-nav .nav-btn:hover{background:#333;transform:scale(1.06)}
.slide-nav .nav-btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.slide-nav .nav-disabled{opacity:.25;pointer-events:none}
.slide-nav .nav-label{font-size:13px;font-weight:500;color:#5f6368;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:8px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(0,0,0,.06)}

</style>
</head>
<body>

<div class="container">
    <div class="left-side">
        <h1>In this Capability</h1>
        <p class="subtext">you will:</p>
    </div>

    <div class="divider"></div>

    <div class="right-side" id="item-list">
        <div class="list-item active" data-index="0">Review <span class="highlight">AI-generated code</span> as a professional <span class="highlight">Evaluator</span>.</div>
        
        <div class="list-item" data-index="1">Apply clear, <span class="highlight">objective rules</span> to ensure <span class="highlight">high-quality output</span>.</div>
        
        <div class="list-item" data-index="2">Maintain the <span class="highlight">high standards</span> that drive our <span class="highlight">project success</span>.</div>

        <div class="list-item" data-index="3">Contribute your <span class="highlight">expertise</span> to impactful, <span class="highlight">large-scale work</span>.</div>
    </div>
</div>

<script>
    const items = document.querySelectorAll('.list-item');
    let currentIndex = 0;
    let autoLoop;
    let isHovering = false;

    // Set initial active state
    items[currentIndex].classList.add('active');

    function highlightNext() {
        if (isHovering) return;
        items.forEach(item => item.classList.remove('active'));
        currentIndex = (currentIndex + 1) % items.length;
        items[currentIndex].classList.add('active');
    }

    function startLoop() {
        autoLoop = setInterval(highlightNext, 3500); // 3.5s for readability
    }

    items.forEach((item, index) => {
        item.addEventListener('mouseenter', () => {
            isHovering = true;
            items.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            currentIndex = index; 
        });

        item.addEventListener('mouseleave', () => {
            isHovering = false;
        });
    });

    setTimeout(startLoop, 2000);
</script>



<div style="height:96px" aria-hidden="true"></div>
<div class="slide-nav">
  <a href="slide-01.html" class="nav-btn" title="Previous"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <span class="nav-label">2 / 9</span>
  <a href="slide-03.html" class="nav-btn" title="Next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
</div>

</body></html>
